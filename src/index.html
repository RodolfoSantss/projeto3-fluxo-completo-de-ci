<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Theme Color</title>

  <style>
    body {
      background-color: white;
      color: black;
      transition: 0.3s;
      font-family: Arial;
      text-align: center;
      padding-top: 100px;
    }

    .dark {
      background-color: black;
      color: white;
    }

    button {
      padding: 10px 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>Troca de Tema</h1>

  <button onclick="toggleTheme()">
    Alternar Tema
  </button>

  <script>
    function toggleTheme() {
      document.body.classList.toggle("dark");
    }
  </script>

</body>
</html>
